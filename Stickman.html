
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stickman Battle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>STICKMAN BATTLE</h1>

  <div class="hud">
    <div class="health-box">
      <span>PLAYER</span>
      <div class="health"><div id="playerHealth"></div></div>
    </div>
    <div class="health-box">
      <span>ENEMY</span>
      <div class="health"><div id="enemyHealth"></div></div>
    </div>
  </div>

  <div id="stats">COMBO: <span id="combo">0</span></div>

  <div class="arena">
    <canvas id="game" width="800" height="400"></canvas>
    <div id="message" class="hidden">
      <h2 id="result">YOU WIN!</h2>
      <button id="restart">PLAY AGAIN</button>
    </div>
  </div>

  <p>Move: A / D | Jump: W | Punch: J | Special: K</p>

  <div class="controls">
    <button data-key="a">◀</button>
    <button data-key="w">JUMP</button>
    <button data-key="d">▶</button>
    <button data-key="j">PUNCH</button>
    <button data-key="k">SPECIAL</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
