
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Stickman Fight</title>
  <link rel="stylesheet" href="Stickman.css">
</head>
<body>
  <h1>STICKMAN FIGHT</h1>

  <div class="game-box">
    <div class="health-box">
      <div class="fighter-health">
        <span>PLAYER</span>
        <div class="bar">
          <div id="playerHealth" class="fill"></div>
        </div>
      </div>

      <div class="fighter-health">
        <span>ENEMY</span>
        <div class="bar">
          <div id="enemyHealth" class="fill enemy-fill"></div>
        </div>
      </div>
    </div>

    <canvas id="game" width="800" height="400"></canvas>
    <div id="message">FIGHT!</div>
  </div>

  <div class="controls">
    <div class="movement">
      <button id="left">◀</button>
      <button id="right">▶</button>
    </div>

    <div class="actions">
      <button id="jump">JUMP</button>
      <button id="attack">PUNCH 👊</button>
    </div>
  </div>

  <button id="restart">PLAY AGAIN</button>
  <p>Move, jump and punch to defeat your enemy!</p>

  <script src="Stickman.js"></script>
</body>
</html>
